services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bmsolar-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - APP_ENV=production
      - DATABASE_URL=mysql://bmsolar:bmsolar_secure_password@tcp(mariadb:3306)/bmsolar?charset=utf8mb4&parseTime=True&loc=UTC
      - APP_BASE_URL=http://localhost:3001
      - WEB_PUBLIC_URL=http://localhost:3000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3002
      - JWT_ACCESS_SECRET=prod_jwt_access_secret_change_in_production_32b!
      - JWT_REFRESH_SECRET=prod_jwt_refresh_secret_change_in_production_32b!
      - STORAGE_DIR=/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  mariadb:
    image: mariadb:11.4
    container_name: bmsolar-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_super_secure_password
      - MYSQL_DATABASE=bmsolar
      - MYSQL_USER=bmsolar
      - MYSQL_PASSWORD=bmsolar_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: bmsolar-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=miniopassword123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mariadb_data:
  minio_data:
  uploads_data:

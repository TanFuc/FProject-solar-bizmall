openapi: 3.0.3
info:
  title: BM SOLAR Public + Admin CMS + Leads API
  version: 1.0.0
  description: Design-first API contract for NestJS modular monolith. Specification only; not deployed. No hardcoded
    business data.
servers:
- url: https://api.example.invalid/api/v1
  description: Replace with configured production origin
- url: http://localhost:3100/api/v1
  description: Local development
tags:
- name: Public Site
- name: Public Catalog
- name: Public Projects
- name: Public Editorial
- name: Public Branches
- name: Public Leads
- name: Admin CMS
- name: Admin Leads
- name: Admin SEO
- name: Admin Identity
- name: Admin Media
- name: Auth
paths:
  /public/site:
    get:
      tags:
      - Public Site
      summary: CMS-driven brand, theme, nav and mobile contact shell
      operationId: get_public_site
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteEnvelope'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '422':
          $ref: '#/components/responses/Error422'
        '304':
          description: Not modified; valid conditional If-None-Match
  /public/pages/resolve:
    get:
      tags:
      - Public Site
      summary: Resolve public path to canonical resource
      operationId: get_public_pages_resolve
